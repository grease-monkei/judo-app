<!DOCTYPE html>
<html>
<head>
    <title>QR Code Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body {
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        #qrcode {
            padding: 20px;
            background: white;
            border: 2px solid #000;
        }
    </style>
</head>
<body>
    <div id="qrcode"></div>
    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "https://whiterockjudo.netlify.app/",
            width: 512,
            height: 512,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
