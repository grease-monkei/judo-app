<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Judo Club Sign-In — Fast, simple attendance tracking for your dojo">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>White Rock Judo Club — Sign-In</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/animations.css">
</head>
<body>
    <div id="app">
        <!-- App Shell -->
        <header id="app-header">
            <div class="header-content">
                <div class="header-left">
                    <img src="images/logo-white-red.png" alt="White Rock Judo Club" class="app-logo-img">
                    <h1 class="app-title">White Rock Judo</h1>
                </div>
                <div id="header-location" class="header-location">
                    <span class="location-dot"></span>
                    <span id="header-location-name">No Location Set</span>
                </div>
            </div>
        </header>

        <main id="main-content">
            <!-- Screens are rendered here by router -->
        </main>

        <nav id="bottom-nav">
            <button class="nav-btn active" data-screen="signin" id="nav-signin">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                <span>Sign In</span>
            </button>
            <button class="nav-btn" data-screen="attendance" id="nav-attendance">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                <span>Attendance</span>
            </button>
            <button class="nav-btn" data-screen="members" id="nav-members">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Members</span>
            </button>
            <button class="nav-btn" data-screen="settings" id="nav-settings">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>Settings</span>
            </button>
        </nav>
    </div>


    <!-- PIN Modal -->
    <div id="pin-modal" class="modal-overlay hidden">
        <div class="modal-card pin-modal-card">
            <h2>🔒 Enter PIN</h2>
            <p class="pin-subtitle">Settings are PIN protected</p>
            <div class="pin-display" id="pin-display">
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
            </div>
            <p id="pin-error" class="pin-error hidden">Incorrect PIN</p>
            <div class="pin-pad">
                <button class="pin-key" data-key="1">1</button>
                <button class="pin-key" data-key="2">2</button>
                <button class="pin-key" data-key="3">3</button>
                <button class="pin-key" data-key="4">4</button>
                <button class="pin-key" data-key="5">5</button>
                <button class="pin-key" data-key="6">6</button>
                <button class="pin-key" data-key="7">7</button>
                <button class="pin-key" data-key="8">8</button>
                <button class="pin-key" data-key="9">9</button>
                <button class="pin-key pin-key-clear" data-key="clear">✕</button>
                <button class="pin-key" data-key="0">0</button>
                <button class="pin-key pin-key-back" data-key="back">⌫</button>
            </div>
            <button class="pin-cancel-btn" id="pin-cancel-btn">Cancel</button>
        </div>
    </div>

    <!-- App Lock Screen -->
    <div id="app-lock-screen" class="app-lock-screen hidden">
        <div class="app-lock-card">
            <img src="images/logo.png" alt="White Rock Judo Club" class="app-lock-logo">
            <h2 class="app-lock-title">White Rock Judo Club</h2>
            <p class="app-lock-subtitle">Enter password to continue</p>
            <div class="app-lock-form">
                <input type="password" id="app-lock-input" class="form-input app-lock-input" placeholder="Password" autocomplete="off">
                <p id="app-lock-error" class="pin-error hidden">Incorrect password</p>
                <button id="app-lock-submit" class="btn btn-gold app-lock-btn">Unlock</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/screens/signin.js"></script>
    <script src="js/screens/attendance.js"></script>
    <script src="js/screens/members.js"></script>
    <script src="js/screens/settings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
